<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="etang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#etang-bg)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Stylized Modern Wallet / Card & Leaf/Coin Motif -->
  <g filter="url(#glow)">
    <!-- Back Card (Tilted) -->
    <rect x="28" y="34" width="72" height="46" rx="10" fill="#ffffff" fill-opacity="0.25" transform="rotate(-6 64 57)" />
    
    <!-- Main Wallet / Front Card -->
    <rect x="26" y="44" width="76" height="50" rx="12" fill="url(#card-grad)" />
    
    <!-- Card Accent Strip -->
    <rect x="26" y="56" width="76" height="8" fill="#0d9488" fill-opacity="0.3" />
    
    <!-- Smart EMV Chip -->
    <rect x="36" y="72" width="16" height="12" rx="3" fill="#10b981" />
    <circle cx="44" cy="78" r="2.5" fill="#ffffff" />

    <!-- Finance Wave Lines -->
    <path d="M62 76 Q70 70 78 76 T92 76" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Sparkle Star Accent -->
    <path d="M96 25 L98.5 33.5 L107 36 L98.5 38.5 L96 47 L93.5 38.5 L85 36 L93.5 33.5 Z" fill="#facc15" />
  </g>
</svg>
